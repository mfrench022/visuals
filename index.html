<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>HOME | michaelfrench.co</title>

	<!-- SET UP FAVICONS -->
	<link href="/icons/favicon.ico" rel="icon" sizes="any">
	<link href="/icons/favicon.svg" rel="icon" type="image/svg+xml">
	<link href="/icons/Touch.png" rel="apple-touch-icon">

	<link rel="stylesheet" href="reset.css">
	<link rel="stylesheet" href="style.css">

	<script src="copy-email.js" defer></script>
	<script src="hero-slideshow.js" defer></script>

</head>
<body>
	<div class="hero">
		<img src="heroimages/hero1.jpg" alt="Preview of work" class="is-active"/>
		<img src="heroimages/hero2.jpg" alt="Preview of work"/>
		<img src="heroimages/hero3.jpg" alt="Preview of work"/>
		<!-- muted + playsinline are required for autoplay (playsinline for iOS) -->
		<video src="heroimages/hero4-small.mp4" poster="heroimages/hero4-poster.jpg" autoplay muted loop playsinline aria-label="Preview of work"></video>
	</div>
	<section class="hero-caption">
		<!-- caption for hero1.jpg, shown before hero-slideshow.js runs; other captions live in that file -->
		<p>Packaging design for Jackfir, an organic men’s grooming brand</p>
	</section>

	<div class="nav-bg" aria-hidden="true"></div>
	<nav>
		<ul>
			<li><a href="/" data-text="Home" class="active">Home</a></li>
			<!-- THIS PAGE WILL INCLUDE MY BIO: -->
			<li><a href="work/" data-text="My Work">My Work</a></li>
			<li><a href="ux/" data-text="UX Design">UX Design</a></li>
			<li><a href="resume/Michael French_Resume26.pdf" target="_blank" data-text="Resume">Resume</a></li>
			<!-- copies email to clipboard (copy-email.js); mailto is the fallback -->
			<li><a href="mailto:michael@michaelfrench.co" data-copy-email="michael@michaelfrench.co" data-text="Contact">Contact</a></li>
		</ul>
	</nav>

	<!-- "email copied" notification, shown by copy-email.js -->
	<div class="toast" role="status" aria-live="polite"></div>

	<!-- screen-blends with the hero -->
	<header class="header-blend">
		<img class="logo" src="logo.png" alt="Michael French Logo">
	</header>
	<div class="header-background"></div>

</body>
</html>
